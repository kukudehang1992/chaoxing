name: 刷课

on:
  # 手动触发：Actions 页面上会出现「Run workflow」按钮
  workflow_dispatch:
  push:
    branches: [ main ]
  # 每天 8 点（北京时间）定时刷课，需要就去掉下面两行注释
  # GitHub 的 cron 用 UTC 时间，UTC 0 点 = 北京时间 8 点
  #schedule:
  #  - cron: "0 0 * * *"

jobs:
  Start:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 单次任务最长约 6 小时，长课程够用
    steps:
      - name: 拷贝代码
        uses: actions/checkout@v4

      - name: 设置python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 安装依赖包
        run: pip install -r ./requirements.txt

      - name: Run main.py
        env:
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          CHAOXING_COURSE_LIST: ${{ secrets.CHAOXING_COURSE_LIST }}
        run: python main.py -u "$CHAOXING_USERNAME" -p "$CHAOXING_PASSWORD" -l "$CHAOXING_COURSE_LIST"
