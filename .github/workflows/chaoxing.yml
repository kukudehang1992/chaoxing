name: 刷课

on:
  # 只保留手动触发；push 不再自动跑。想加每天定时，把 schedule 两行注释去掉
  workflow_dispatch:
  #schedule:
  #  - cron: "0 0 * * *"

jobs:
  Start:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 拷贝代码
        uses: actions/checkout@v4

      - name: 设置python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 安装依赖包
        run: pip install -r ./requirements.txt

      - name: 生成配置文件
        env:
          CX_CONFIG: ${{ secrets.CX_CONFIG }}
        run: |
          if [ -z "$CX_CONFIG" ]; then echo "缺少 CX_CONFIG 这个 Secret"; exit 1; fi
          printf '%s\n' "$CX_CONFIG" > config.ini
          echo "配置文件行数: $(wc -l < config.ini)"
          python -c "import configparser;c=configparser.ConfigParser();c.read('config.ini',encoding='utf8');print('provider =',c.get('tiku','provider'));print('submit =',c.get('tiku','submit'));print('course_list =',c.get('common','course_list'));print('用户名长度 =',len(c.get('common','username')))"

      - name: Run main.py
        run: python main.py -c config.ini
